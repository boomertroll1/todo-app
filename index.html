<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Úkoly">
  <title>To-Do List</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b82f6'/%3E%3Cpath d='M18 33l10 10 18-22' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="error-banner" class="error-banner hidden" role="alert"></div>

  <!-- Načítání -->
  <main id="loading-view" class="center-screen">
    <div class="spinner" aria-label="Načítám"></div>
  </main>

  <!-- Přihlášení -->
  <main id="auth-view" class="center-screen hidden">
    <section class="auth-card">
      <h1>Přihlášení</h1>
      <p class="muted">Přihlas se svým účtem ze Supabase.</p>
      <form id="login-form" class="stack">
        <label class="field">
          <span>E-mail</span>
          <input id="email-input" type="email" autocomplete="email" required placeholder="tvuj@email.cz">
        </label>
        <label class="field">
          <span>Heslo</span>
          <input id="password-input" type="password" autocomplete="current-password" required placeholder="••••••••">
        </label>
        <button type="submit" id="login-btn" class="btn btn-primary">Přihlásit se</button>
      </form>
    </section>
  </main>

  <!-- Hlavní aplikace -->
  <main id="app-view" class="app-shell hidden">
    <header class="app-header">
      <div>
        <h1>Úkoly</h1>
        <p id="stats-text" class="muted">0 aktivních</p>
      </div>
      <div class="header-actions">
        <button id="refresh-btn" class="btn btn-ghost" type="button" title="Synchronizovat">↻</button>
        <button id="logout-btn" class="btn btn-ghost" type="button">Odhlásit</button>
      </div>
    </header>

    <!-- Přidání úkolu -->
    <form id="todo-form" class="add-card">
      <input id="title-input" type="text" placeholder="Co je potřeba udělat?" maxlength="200" required autocomplete="off">
      <div class="add-controls">
        <select id="priority-input" aria-label="Priorita">
          <option value="high">Vysoká priorita</option>
          <option value="medium" selected>Střední priorita</option>
          <option value="low">Nízká priorita</option>
        </select>
        <input id="due-input" type="date" aria-label="Termín">
        <button type="submit" class="btn btn-primary">Přidat</button>
      </div>
    </form>

    <!-- Filtry a řazení -->
    <section class="toolbar">
      <div class="filter-group" role="tablist">
        <button type="button" class="chip active" data-filter="all">Vše</button>
        <button type="button" class="chip" data-filter="active">Aktivní</button>
        <button type="button" class="chip" data-filter="completed">Hotové</button>
      </div>
      <div class="toolbar-right">
        <select id="sort-select" aria-label="Řazení">
          <option value="smart">Podle priority</option>
          <option value="due">Podle termínu</option>
          <option value="newest">Nejnovější</option>
        </select>
        <button id="clear-completed-btn" type="button" class="btn btn-danger-ghost hidden">
          Smazat hotové
        </button>
      </div>
    </section>

    <!-- Seznam úkolů -->
    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty-state" class="empty-state hidden">Žádné úkoly k zobrazení.</p>
  </main>

  <!-- Dialog pro úpravu úkolu -->
  <dialog id="edit-dialog" class="edit-dialog">
    <form id="edit-form" class="stack">
      <h2>Upravit úkol</h2>
      <input type="hidden" id="edit-id">
      <label class="field">
        <span>Název</span>
        <input id="edit-title" type="text" maxlength="200" required>
      </label>
      <div class="edit-row">
        <label class="field">
          <span>Priorita</span>
          <select id="edit-priority">
            <option value="high">Vysoká</option>
            <option value="medium">Střední</option>
            <option value="low">Nízká</option>
          </select>
        </label>
        <label class="field">
          <span>Termín</span>
          <input id="edit-due" type="date">
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" id="cancel-edit-btn" class="btn btn-ghost">Zrušit</button>
        <button type="submit" class="btn btn-primary">Uložit</button>
      </div>
    </form>
  </dialog>
</body>
</html>
